<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/3.0.3/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./src/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .chart-container {
      /* display: flex; */
      justify-content: space-around;
      width: 100%;
      max-width: 1800px;
    }

    #chart1 {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;

    }

    #chart2 {
      width: 100%;
      height: 300px;
      border: 1px solid #ccc;
    }

    .controls {
      margin-bottom: 20px;
      width: 80%;
      max-width: 600px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 60px;
      padding: 5px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>


  <div class="container">
    <div class="row">
      <div class="col-8">
        <div id="echart"></div>
      </div>
      <div class="col-4">
        <div id="chart2"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <p>Điểm NCC tối đa: <strong id="maxScore">...</strong> | Vị trí bắt đầu: <strong id="bestIndex">...</strong></p>
  </div>

  <div class="chart-container">
    <div id="chart1"></div>
  </div>


  <div id="fixed_form">
    <div class="d-flex align-items-center">
      <span id="addon-wrapping">Token</span>
      <input id="DOM_accessToken" type="text" value="" class="me-2" />
    </div>

    <div class="card bg_opacity">
      <div class="card-row">
        <span class="label">Label:</span>
        <h5 id="DOM_choice" class="value">1</h5>
      </div>
      <div class="d-flex align-items-center">
        <span>Value</span>
        <input id="DOM_value" type="text" value="" class="me-2" />
      </div>
      <button id="DOM_isFollow" style="background-color: green;">Follow</button>
      <button id="DOM_isConnectGame">CnectH</button>
      <button id="DOM_connectPyserver">CnectP</button>

      <div id="chat-container" class="bg_opacity"></div>
    </div>

  </div>
  <script>



    function addMessage(content = "...", from = "player") {
      const chatBox = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-message ${from}`;
      msgDiv.innerHTML = `<small>${new Date().getTime()}___${from}:</small> ${content}`;
      chatBox.appendChild(msgDiv);

      // 👇 Giới hạn chỉ giữ lại 10 tin nhắn mới nhất
      while (chatBox.children.length > 10) {
        chatBox.removeChild(chatBox.firstChild);
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function hideScrollbars() {
      document.documentElement.style.overflow = 'auto';
      document.body.style.overflow = 'auto';

      // Chrome, Safari
      document.documentElement.style.scrollbarWidth = 'none';
      document.body.style.scrollbarWidth = 'none';

      // IE, Edge
      document.documentElement.style.msOverflowStyle = 'none';
      document.body.style.msOverflowStyle = 'none';
    }

    // Gọi khi trang load
    document.addEventListener("DOMContentLoaded", hideScrollbars);

    // Gọi khi resize
    window.addEventListener("resize", hideScrollbars);

    // Gọi khi nội dung DOM thay đổi
    const observer = new MutationObserver(hideScrollbars);
    observer.observe(document.body, { childList: true, subtree: true });

  </script>
  <script src="./src/echart.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/remote.js"></script>

</body>

</html>
